[project]
name = "pawangunjkar-observability-mcp"
version = "1.0.0"
description = "MCP server for Prometheus, Loki, Tempo, and Grafana — logs, metrics, traces, alerts"
requires-python = ">=3.10"
authors = [{ name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "observability", "prometheus", "loki", "tempo", "grafana"]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
pawangunjkar-observability-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
